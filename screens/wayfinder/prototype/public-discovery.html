<title>LocalConnect Public Discovery — Prototype (issue #18)</title>
<!--
  PROTOTYPE — decision record for issue Calel33/dircteshop#18
  Reviewed live and ACCEPTED: Variant B — "Utility search-first".
  Kept in-repo (not throwaway) as the primary source for the B4 decisions.

  Question: what public-discovery design should be accepted before B4
  (landing + search + category browse) is built?

  Plan: three structurally different variants of the public discovery system
  — landing · search · categories · category detail — switchable via the
  floating bottom bar, #v=A|B|C, or the left/right arrow keys.

    A — Classic grid    centered hero · category tile grid · 3-col photo cards
    B — Utility         search-first header · dense rows · sidebar filters  <-- ACCEPTED
    C — Editorial       split hero + spotlight · rails · split New/Verified band

  Covers (per issue #18): Explore by Category · Trending This Week (isFeatured)
  · New to LocalConnect · Recently Verified · Open Now + Highly Rated chips
  (real, computed) · Trending/Special Offers/Nearby disabled w/ tooltips ·
  BusinessCard (public rich density, actions capped at 2) · Load-more cursor
  pagination · loading skeletons · hidden-empty sections · no-results state ·
  responsive collapse (container queries + width toggle).

  Prototype invariants (from ticket 08): only status === 'approved' renders
  anywhere; the fixture includes 4 non-approved businesses that must never
  appear. Decision points for the review session are listed at the bottom.

  Not production code. No backend, no persistence, no tests (per /prototype).
  Open by double-clicking. Kept in-repo per the issue #18 decision.
  Palette here follows the screen mockups (blue/slate); confirm against the
  B4 token source in issue #4 (design.md, root) before visual sign-off.
-->

function openNow(b){
  if(!b.hours) return {open:false, label:'Hours not listed'};
  if(b.hours === '24h') return {open:true, label:'Open 24 hours'};
  var d = new Date(), day = DAYKEYS[d.getDay()], mins = d.getHours()*60 + d.getMinutes(), span = b.hours[day];
  if(!span) return {open:false, label:'Closed today'};
  if(mins >= span[0] && mins < span[1]) return {open:true, label:'Open now \u00b7 closes '+fmtTime(span[1])};
  if(mins < span[0]) return {open:false, label:'Closed \u00b7 opens '+fmtTime(span[0])};

  if(S.chips.openNow && !openNow(b).open) return false;
  if(S.chips.highlyRated && !(b.rating >= 4.5 && b.count > 0)) return false;
  return true;

function matchesQuery(b, q){

      trendingSectionB(d.trending)+
      '<section class="chips-sec">'+chipbarHtml()+'</section>'+
      freshSectionB(d.fresh)+
      verifiedSectionB(d.verified)+
      ((d.trending.length + d.fresh.length + d.verified.length === 0 && hasChips()) ? emptyHtml() : '')+
      '</div>';
    return headerB()+lead+body;
  },
  results: function(){
    return headerB()+'<div class="wrap"><div class="sec">'+titleHtml()+
      '<div class="vB-split">'+sideB()+'<div id="results-region">'+B.resultsRegion()+'</div></div>'+
      '</div></div>';
  },
  resultsRegion: function(){
    if(S.state==='loading') return '<div class="vB-results">'+skeletonRows(4)+'</div>';
    var list = resultsAll(), total = list.length;
    if(total===0) return emptyHtml();
    return countLineHtml(total)+'<div class="vB-results">'+list.slice(0,S.shown).map(rowB).join('')+'</div>'+loadMoreHtml(total);
  },
  cats: function(){
    var grid = S.state==='loading' ? '<div class="vB-minis">'+skMinis(8)+'</div>'
      : '<div class="vB-minis">'+CATS.map(catCardB).join('')+'</div>';
    return headerB()+'<div class="wrap"><div class="sec"><h1>Browse Categories</h1>'+
      '<div class="sec-sub lead-sub">Every approved business, grouped by category.</div>'+grid+'</div></div>';
  }
};
function trendingSectionB(list){
  if(!list.length) return '';
  return '<section class="sec"><div class="sec-head"><div><h2>Trending This Week</h2>'+
    '<div class="sec-sub">Featured by the LocalConnect team</div></div>'+
    '<button class="sec-link" data-act="view:search">View all'+ic('arrow')+'</button></div>'+
    '<div class="vB-rows">'+list.map(rowB).join('')+'</div></section>';
}
function freshSectionB(list){
  if(!list.length) return '';
  return '<section class="sec"><div class="sec-head"><div><h2>New to LocalConnect</h2>'+
    '<div class="sec-sub">Recently joined businesses</div></div></div>'+
    '<div class="vB-minis">'+list.map(miniB).join('')+'</div></section>';
}
function verifiedSectionB(list){
  if(!list.length) return '';
  return '<section class="sec"><div class="sec-head"><div><h2>Recently Verified</h2>'+
    '<div class="sec-sub">Independently checked listings</div></div></div>'+
    '<div class="vB-vrows">'+list.map(rowB).join('')+'</div></section>';
}
/* ===== variant C — editorial ===== */
function spotC(b){
  var o = openNow(b);
  return '<div class="vC-spot">'+photoHtml(b)+
    '<div class="spot-body">'+
      '<span class="spot-flag">'+ic('star')+'Featured this week</span>'+
      '<div class="spot-name">'+esc(b.name)+'</div>'+
      '<div class="spot-meta">'+ratingHtml(b)+'<span>'+esc(catName(b.cat))+'</span>'+
      '<span class="open-line"><span class="dot '+(o.open?'open':'closed')+'"></span>'+esc(o.label)+'</span></div>'+
    '</div></div>';
}
function blockC(c){
  var tint = 'p' + (1 + (CATS.indexOf(c) % 6));
  return '<button class="vC-block '+tint+'" data-act="cat:'+c.slug+'">'+
    '<span class="blk-ic">'+ic(c.icon)+'</span>'+
    '<span class="blk-name">'+esc(c.name)+'</span>'+
    '<span class="blk-count">'+catCount(c.slug)+' businesses</span></button>';
}
function bandRowC(b){
  return '<div class="vC-band-row">'+photoHtml(b)+
    '<div class="body"><h3 class="name">'+esc(b.name)+'</h3>'+
    '<div class="meta-line">'+ratingHtml(b)+'<span class="tiny">'+esc(catName(b.cat))+'</span></div></div></div>';
}
var C = {
  name: 'Editorial',
  land: function(){
    var d = landingData();
    var spot = (S.state!=='loading' && d.trending.length) ? spotC(d.trending[0]) : '<div class="sk sk-spot" aria-hidden="true"></div>';
    var hero = '<section class="vC-hero wrap"><div class="vC-hero-copy"><div class="eyebrow">Local directory · v1</div>'+
      '<h1>Find the best of your town.</h1>'+
      '<p class="sub">Hand-checked listings, real hours, and a category for everything — from wood-fired pizza to estate planning.</p>'+
      searchBarA()+'</div>'+spot+'</section>';
    if(S.state==='loading'){
      return headerC()+hero+'<div class="wrap">'+
        '<section class="sec"><div class="vC-blocks">'+skTiles(8)+'</div></section>'+
        '<section class="sec"><div class="vC-rail"><div class="vC-rail-card">'+skeletonCards(1)+'</div><div class="vC-rail-card">'+skeletonCards(1)+'</div><div class="vC-rail-card">'+skeletonCards(1)+'</div></div></section>'+
        '<section class="sec"><div class="vC-band"><div class="vC-band-light">'+skRows(3)+'</div><div class="vC-band-ink">'+skRows(3)+'</div></div></section>'+
        '</div>';
    }
    var body = '<div class="wrap">'+
      (S.state==='sparse' ? '<div class="vC-banner">'+ic('info')+' Sparse-data demo: Trending This Week and Recently Verified have no approved data, so both sections are hidden entirely (SPEC section 8).</div>' : '')+
      '<section class="sec"><div class="sec-head"><div><h2>Explore by Category</h2>'+
      '<div class="sec-sub">'+approved().length+' approved businesses across '+CATS.length+' categories</div></div>'+
      '<button class="sec-link" data-act="view:categories">All categories'+ic('arrow')+'</button></div>'+
      '<div class="vC-blocks">'+CATS.map(blockC).join('')+'</div></section>'+
      (d.trending.length ? '<section class="sec"><div class="sec-head"><div><h2>Trending This Week</h2>'+
        '<div class="sec-sub">Featured by the LocalConnect team · scroll sideways</div></div></div>'+
        '<div class="vC-rail">'+d.trending.map(function(b){ return '<div class="vC-rail-card">'+cardA(b)+'</div>'; }).join('')+'</div></section>' : '')+
      '<section class="chips-sec">'+chipbarHtml()+'</section>'+
      ((d.fresh.length || d.verified.length) ? '<section class="sec"><div class="vC-band">'+
        '<div class="vC-band-light"><div class="band-title">'+ic('arrow')+'New to LocalConnect</div>'+
          (d.fresh.length ? d.fresh.map(bandRowC).join('') : '<span class="tiny muted">No new listings right now.</span>')+'</div>'+
        '<div class="vC-band-ink"><div class="band-title">'+ic('check')+'Recently Verified</div>'+
          (d.verified.length ? d.verified.map(bandRowC).join('') : '<span class="tiny">No recently verified listings.</span>')+'</div>'+
        '</div></section>' : '')+
      ((d.trending.length + d.fresh.length + d.verified.length === 0 && hasChips()) ? emptyHtml() : '')+
      '</div>';
    return headerC()+hero+body;
  },
  results: function(){
    return headerC()+'<div class="wrap"><div class="sec">'+titleHtml()+
      '<div class="vC-toolbar">'+(S.view==='search' ? searchBarA() : '')+chipbarHtml()+'<span class="tiny muted">Sorted by rating (prototype)</span></div>'+
      '<div id="results-region">'+C.resultsRegion()+'</div>'+
      '</div></div>';
  },
  resultsRegion: function(){
    if(S.state==='loading') return '<div class="vC-mixed">'+skeletonCards(5)+'</div>';
    var list = resultsAll(), total = list.length;
    if(total===0) return emptyHtml();
    var vis = list.slice(0,S.shown), first = vis[0], rest = vis.slice(1);
    var feature = '<article class="vA-card vC-feature">'+photoHtml(first, verifiedHtml(first))+
      '<div class="body"><span class="cat-eyebrow">'+ic(catOf(first.cat).icon)+esc(catName(first.cat))+'</span>'+
      '<h3 class="name">'+esc(first.name)+'</h3>'+
      '<div class="meta-line">'+ratingHtml(first)+openHtml(first)+'</div>'+
      '<p class="desc">'+esc(first.desc)+'</p>'+
      '<span class="meta-line tiny">'+ic('pin')+esc(first.addr)+'</span>'+
      '<div class="foot">'+actionsHtml(first,2)+'</div></div></article>';
    return countLineHtml(total)+'<div class="vC-mixed">'+feature+rest.map(cardA).join('')+'</div>'+loadMoreHtml(total);
  },
  cats: function(){
    var grid = S.state==='loading' ? '<div class="vC-blocks">'+skTiles(8)+'</div>'
      : '<div class="vC-blocks">'+CATS.map(blockC).join('')+'</div>';
    return headerC()+'<div class="wrap"><div class="sec"><h1>Browse Categories</h1>'+
      '<div class="sec-sub lead-sub">Every approved business, grouped by category.</div>'+grid+'</div></div>';
  }
};

/* ===== paint + chrome + events ===== */
var V = {A:A, B:B, C:C};
var app = document.getElementById('app');
var frame = document.getElementById('frame');
var hintEl = document.getElementById('hint');
var chrome = document.getElementById('chrome');
var stateSel = document.getElementById('stateSel');

function stateOptions(){
  return S.view==='landing'
    ? [['normal','Normal data'],['loading','Loading skeletons'],['sparse','Hidden-empty sections']]
    : [['normal','Normal data'],['loading','Loading skeletons'],['no-results','No results']];
}
function validateState(){
  var ok = stateOptions().some(function(o){ return o[0]===S.state; });
  if(!ok) S.state = 'normal';
}
function renderView(){
  if(S.view==='landing') return V[S.v].land();
  if(S.view==='categories') return V[S.v].cats();
  return V[S.v].results();
}
function updateChrome(){
  document.getElementById('vlabel').innerHTML = '<b>'+S.v+'</b> — '+VNAMES[S.v];
  Array.prototype.forEach.call(document.querySelectorAll('#viewbtns .cbtn'), function(b){
    b.classList.toggle('on', b.getAttribute('data-view')===S.view);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#widthbtns .cbtn'), function(b){
    b.classList.toggle('on', b.getAttribute('data-width')===S.w);
  });
  stateSel.innerHTML = stateOptions().map(function(o){
    return '<option value="'+o[0]+'"'+(o[0]===S.state?' selected':'')+'>'+o[1]+'</option>';
  }).join('');
  frame.setAttribute('data-w', S.w);
  var notes = ['Fixture: 21 businesses, 17 approved — the 4 non-approved never render', 'Card actions capped at 2', 'Search: try “coffee” or “pizza”'];
  if(S.state==='sparse') notes.push('Sparse: empty sections hidden');
  if(S.state==='loading') notes.push('Skeletons');
  if(S.state==='no-results') notes.push('No-results empty state');
  document.getElementById('cnote').textContent = notes.join(' · ');
  hintEl.textContent = '← → cycle variants ('+S.v+' of 3) · B accepted for B4 (issue #18) · chips filter live · view: '+S.view+' · width: '+S.w;
}
function paint(){
  app.innerHTML = renderView();
  writeState();
  updateChrome();
}
function updateResults(){
  var el = document.getElementById('results-region');
  if(el){ el.innerHTML = V[S.v].resultsRegion(); writeState(); updateChrome(); }
}
function rememberFocus(){
  var el = document.activeElement;
  return (el && el.getAttribute && el.getAttribute('data-focus')) || null;
}
function restoreFocus(key){
  if(!key) return;
  var el = app.querySelector('[data-focus="'+key+'"]');
  if(el && el.focus) el.focus();
}
function cycleVariant(d){
  var i = VARIANTS.indexOf(S.v);
  S.v = VARIANTS[(i+d+VARIANTS.length) % VARIANTS.length];
  paint();
}
function act(a){
  var parts = a.split(':'), k = parts[0], arg = parts.slice(1).join(':');
  if(k==='view'){ S.view=arg; S.shown=6; validateState(); paint(); }
  else if(k==='cat'){ S.view='category'; S.cat=arg; S.shown=6; validateState(); paint(); }
  else if(k==='chip'){ S.chips[arg]=!S.chips[arg]; S.shown=6; paint(); }
  else if(k==='loadmore'){ S.shown+=6; updateResults(); }
  else if(k==='clear-chips'){ S.chips.openNow=false; S.chips.highlyRated=false; S.shown=6; paint(); }
  else if(k==='clear-all'){ S.chips.openNow=false; S.chips.highlyRated=false; if(S.view==='search') S.q=''; S.shown=6; paint(); }
  else if(k==='search-go'){ var qi=document.getElementById('q-input'); if(qi) S.q=qi.value; S.view='search'; S.shown=6; validateState(); paint(); }
  else if(k==='all-businesses'){ S.view='search'; S.q=''; S.shown=6; validateState(); paint(); }
}
app.addEventListener('click', function(e){
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var key = rememberFocus();
  act(el.getAttribute('data-act'));
  restoreFocus(key);
});
app.addEventListener('input', function(e){
  if(e.target && e.target.id==='q-input'){ S.q=e.target.value; S.shown=6; updateResults(); }
});
app.addEventListener('keydown', function(e){
  if(e.target && e.target.id==='q-input' && e.key==='Enter'){ S.view='search'; S.shown=6; validateState(); paint(); }
});
chrome.addEventListener('click', function(e){
  var b = e.target && e.target.closest ? e.target.closest('[data-view]') : null;
  if(b){ S.view=b.getAttribute('data-view'); S.shown=6; validateState(); paint(); return; }
  var w = e.target.closest ? e.target.closest('[data-width]') : null;
  if(w){ S.w=w.getAttribute('data-width'); updateChrome(); writeState(); return; }
  if(e.target.closest('#vprev')) cycleVariant(-1);
  else if(e.target.closest('#vnext')) cycleVariant(1);
});
stateSel.addEventListener('change', function(){ S.state=stateSel.value; validateState(); paint(); });
document.addEventListener('keydown', function(e){
  var t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
  if(e.key==='ArrowLeft') cycleVariant(-1);
  if(e.key==='ArrowRight') cycleVariant(1);
});

/* ===== URL state (shareable / reload-stable) ===== */
function readState(){
  var hp = new URLSearchParams(location.hash.replace(/^#/,''));
  var qp = new URLSearchParams(location.search);
  function get(k){ var a=hp.get(k); if(a!==null) return a; return qp.get(k); }
  var v = get('v') || get('variant');
  if(v && VARIANTS.indexOf(v.toUpperCase())>=0) S.v = v.toUpperCase();
  var view = get('view'); if(view && VIEWS.indexOf(view)>=0) S.view = view;
  var st = get('state'); if(st) S.state = st;
  var w = get('w'); if(w && ['desktop','tablet','mobile'].indexOf(w)>=0) S.w = w;
  var q = get('q'); if(q!==null) S.q = q;
  var cat = get('cat');
  if(cat && CATS.some(function(c){ return c.slug===cat; })) S.cat = cat;
  var chips = get('chips');
  if(chips){ S.chips.openNow = chips.indexOf('openNow')>=0; S.chips.highlyRated = chips.indexOf('highlyRated')>=0; }
  validateState();
}
function writeState(){
  var p = new URLSearchParams();
  p.set('v', S.v); p.set('view', S.view); p.set('state', S.state); p.set('w', S.w);
  if(S.view==='search' && S.q) p.set('q', S.q);
  if(S.view==='category') p.set('cat', S.cat);
  var chips = [];
  if(S.chips.openNow) chips.push('openNow');
  if(S.chips.highlyRated) chips.push('highlyRated');
  if(chips.length) p.set('chips', chips.join(','));
  var url = location.pathname + location.search + '#' + p.toString();
  try{ history.replaceState(null, '', url); }catch(err){ location.hash = p.toString(); }
}

readState();
paint();

  5. Load-more wording/placement ("Load more" + "Showing X of Y" + end state).
  6. Disabled-chip tooltip copy (Trending / Special Offers / Nearby).
  7. Empty-state copy + CTAs (Clear filters + Browse categories).
  8. Responsive collapse: confirm the two breakpoints (60rem / 44rem) and the
     mobile card compaction (photo 21/9, single column, chip row scrolls).
  9. Categories landing section on /categories — same tiles as the landing, or
     richer (descriptions / subcategories)?
  10. Header: search-in-header (B) vs hero search (A/C) as the product default.
*/
})();
</script>
